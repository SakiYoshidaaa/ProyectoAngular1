<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="card login-card p-4" style="width: 100%; max-width: 400px;">
    <div class="card-body">
      <h2 class="text-center mb-4 fw-bold">Iniciar Sesión</h2>
      <form>
        <div class="mb-3">
          <label for="email" class="form-label">Nombre</label>
          <input type="email" class="form-control" id="text" placeholder="nombre" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Entrar</button>
      </form>
      <div class="text-center mt-3">
        <p class="small text-muted">¿No tienes cuenta? <a href="#" class="text-decoration-none">Regístrate</a></p>
      </div>
    </div>
  </div>
</div>
